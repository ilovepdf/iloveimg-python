name: Validate Secrets Job

on:
  workflow_call:
    secrets:
      ILOVEIMG_PUBLIC_KEY:
        required: true
      ILOVEIMG_SECRET_KEY:
        required: true
    outputs:
      secrets_available:
        description: "Whether the API keys are configured"
        value: ${{ jobs.validate_secrets.outputs.secrets_available }}

jobs:
  validate_secrets:
    name: Validate API Keys
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-latest
    outputs:
      secrets_available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check if secrets are set
        id: check
        run: |
          if [ -n "${{ secrets.ILOVEIMG_PUBLIC_KEY }}" ] && [ -n "${{ secrets.ILOVEIMG_SECRET_KEY }}" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
            echo "✓ API keys are configured"
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "✗ API keys are missing"
            echo "Please configure ILOVEIMG_PUBLIC_KEY and ILOVEIMG_SECRET_KEY in repository secrets"
            exit 1
          fi
