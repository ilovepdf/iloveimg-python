[project]
name = "iloveimg"
description = "iLoveIMG Python API"
version = "1.0.0"
authors = [{ name = "ilovepdf", email = "info@ilovepdf.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

requires-python = ">=3.9,<=3.12.12"
dependencies = ["requests>=2.28.0", "pyjwt>=2.4.0", "python-dotenv>=1.0.0"]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Documentation = "https://developer.ilovepdf.com/docs"
Homepage = "https://ilovepdf.com/"

[tool.setuptools.packages.find]
where = ["."]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 88
py_version = 39
combine_as_imports = true
include_trailing_comma = true
force_grid_wrap = 0

known_first_party = ["iloveimg"]

[tool.flake8]
exclude = ".git,future,venv"
max-line-length = 88
extend-ignore = ["E203"]

[tool.pylint.format]
max-line-length = 88

[tool.pylint."MESSAGES CONTROL"]
disable = ["C0116"]

[tool.pylint.master]
ignore = ["samples"]
